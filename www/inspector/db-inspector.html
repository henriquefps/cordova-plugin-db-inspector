  }
  :root[data-theme="dark"] {

    --primary: oklch(0.72 0.14 255);
    --primary-hover: oklch(0.77 0.12 255);
    --on-primary: oklch(0.153 0.009 250);
    --primary-2: oklch(0.32 0.065 255);
    --primary-text: oklch(0.8 0.11 255);
    --ring: oklch(0.5 0.14 255 / 0.6);
    --danger: oklch(0.704 0.191 22.216);
    --danger-2: oklch(0.3 0.07 25);
    --success: oklch(0.72 0.14 255);
    --success-2: oklch(0.32 0.065 255);
    --warning: oklch(0.828 0.189 84.429);
    --warning-2: oklch(0.31 0.06 75);
    --null: oklch(0.62 0.025 250);
    --num: oklch(0.78 0.12 330);
    --kw: oklch(0.76 0.13 255);
    --str: oklch(0.8 0.13 155);
    --cmt: oklch(0.66 0.03 250);
    --param: oklch(0.8 0.14 60);
    --ident: oklch(0.8 0.08 215);
    --toast-bg: oklch(0.32 0.024 250);
    --toast-fg: oklch(0.988 0.0045 250);
    --overlay: oklch(0 0 0 / 0.6);
    --shadow: 0 1px 2px 0 rgb(0 0 0 / 0.3);
    --shadow-lg: 0 16px 40px -8px rgb(0 0 0 / 0.6);
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  html { overscroll-behavior-y: none; }
  body {
    margin: 0;
    font: 14px/1.45 var(--font);
    font-feature-settings: 'cv11', 'calt';
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    -webkit-tap-highlight-color: transparent;

    overflow: hidden;
  }
  #app { display: flex; flex-direction: column; height: 100%; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button, [role="button"] { touch-action: manipulation; }
  code, .mono { font-family: var(--mono); font-size: .92em; }
  .ico { width: 18px; height: 18px; flex: none; fill: currentColor; vertical-align: -0.25em; }
  .ico.sm { width: 16px; height: 16px; }
  :focus-visible { outline: 2px solid var(--ring); outline-offset: 1px; }

  /* ---- Header (chrome on the tinted background, no bottom border) ---- */
  header.top {
    display: flex; align-items: center; gap: 8px;
    min-height: 56px;
    padding: 10px max(12px, env(safe-area-inset-right, 0px)) 10px max(12px, env(safe-area-inset-left, 0px));

  }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 15px; white-space: nowrap; }
  .brand .logo { width: 30px; height: 30px; border-radius: var(--radius-sm); background: var(--primary); display: grid; place-items: center; color: var(--on-primary); }
  .brand .logo .ico { width: 18px; height: 18px; }
  .db-chip {
    flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px;
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-md);
    padding: 5px 10px; min-height: 36px; cursor: pointer; text-align: left; box-shadow: var(--shadow);
  }
  .db-chip .name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .db-chip .meta { color: var(--muted); font-size: 12px; white-space: nowrap; }
  .db-chip .grow { flex: 1; min-width: 0; display: flex; flex-direction: column; line-height: 1.25; }
  .db-chip > .ico { color: var(--muted); }
  .icon-btn {
    width: 36px; height: 36px; display: grid; place-items: center; flex: none;

    transition: background-color .15s ease;
  }

  .icon-btn:active { transform: scale(.96); }

  /* ---- Nav ---- */
  nav.tabs {
    display: flex; gap: 2px; padding: 0 max(8px, env(safe-area-inset-left, 0px)) 8px; background: var(--bg);
    overflow-x: auto; flex: none; scrollbar-width: none;
  }
  nav.tabs::-webkit-scrollbar { display: none; }
  .tab {
    display: flex; align-items: center; gap: 6px; padding: 8px 12px; border: 0; background: none; min-height: 36px;
    color: var(--muted); font-weight: 500; cursor: pointer; border-radius: var(--radius-md); white-space: nowrap;
    transition: background-color .15s ease, color .15s ease;
  }
  .tab:hover { color: var(--text); }
  .tab.active { color: var(--text); background: var(--surface); box-shadow: var(--shadow), 0 0 0 1px var(--border); }
  .tab.active .ico { color: var(--primary); }
  .tab .count { font-size: 12px; line-height: 16px; background: var(--surface-3); color: var(--text-2); border-radius: 999px; padding: 0 7px; font-weight: 500; font-variant-numeric: tabular-nums; }
  .subtabs { display: inline-flex; background: var(--surface-3); border-radius: var(--radius-md); padding: 3px; gap: 2px; flex-wrap: wrap; }
  .subtab { border: 0; background: none; padding: 6px 12px; border-radius: var(--radius-sm); font-weight: 500; color: var(--text-2); cursor: pointer; display: flex; align-items: center; gap: 6px; font-size: 13px; }
  .subtab.active { background: var(--surface); color: var(--text); box-shadow: var(--shadow); }

  /* ---- The card: fills the rest of the screen, content scrolls inside it ---- */
  main#view {
    flex: 1; min-height: 0; min-width: 0; overflow: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain;
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-xl); box-shadow: var(--shadow);
    margin: 0 max(8px, env(safe-area-inset-right, 0px)) max(8px, env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px));
  }
  @media (min-width: 768px) {
    main#view { margin: 0 max(12px, env(safe-area-inset-right, 0px)) max(12px, env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px)); }
  }
  .pad { padding: 16px; padding-bottom: 24px; }
  @media (max-width: 599px) { .pad { padding: 12px; padding-bottom: 20px; } }

  /* ---- Generic UI ---- */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    border: 1px solid var(--border-strong); background: var(--surface); color: var(--text);
    padding: 7px 12px; border-radius: var(--radius-md); font-weight: 500; font-size: 14px; line-height: 20px; cursor: pointer; white-space: nowrap;
    min-height: 36px; box-shadow: var(--shadow); transition: background-color .15s ease, border-color .15s ease;
  }
  .btn:hover { background: var(--surface-2); }
  .btn:active { transform: translateY(1px); }
  .btn.primary { background: var(--primary); border-color: var(--primary); color: var(--on-primary); }
  .btn.primary:hover { background: var(--primary-hover); border-color: var(--primary-hover); }
  .btn.ghost { background: transparent; border-color: transparent; color: var(--text-2); box-shadow: none; }
  .btn.ghost:hover { background: var(--surface-3); }
  .btn.danger { color: var(--danger); }
  .btn.sm { padding: 4px 10px; min-height: 30px; font-size: 13px; line-height: 18px; border-radius: var(--radius-sm); }
  .btn:disabled { opacity: .45; pointer-events: none; }
  .row { display: flex; align-items: center; gap: 8px; }
  .row.wrap { flex-wrap: wrap; }
  .spacer { flex: 1; }
  .muted { color: var(--muted); }
  .small { font-size: 12.5px; }
  .nowrap { white-space: nowrap; }
  .ellipsis { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  input.input, select.input, textarea.input {
    width: 100%; border: 1px solid var(--border-strong); background: var(--surface); border-radius: var(--radius-md);
    padding: 7px 10px; min-height: 36px; outline: none; box-shadow: var(--shadow);
    transition: border-color .15s ease, box-shadow .15s ease;
  }
  input.input::placeholder, textarea.input::placeholder { color: var(--muted); }
  input.input:focus, select.input:focus, textarea.input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--ring); }
  select.input { padding-right: 28px; -webkit-appearance: none; appearance: none;
    background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
    background-position: calc(100% - 15px) 52%, calc(100% - 10px) 52%; background-size: 5px 5px; background-repeat: no-repeat; }
  @media (max-width: 767px) {
    input.input, select.input, textarea.input { font-size: 16px; }
  }
  .search { position: relative; }
  .search .ico { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--muted); }
  .search input { padding-left: 34px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); }
  .card + .card { margin-top: 12px; }
  .card-h { display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-bottom: 1px solid var(--border); font-weight: 600; }
  .card-h .ico { color: var(--muted); }
  .card-b { padding: 14px; }
  .badge { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; line-height: 18px; font-weight: 500; padding: 0 8px; border-radius: 999px; background: transparent; border: 1px solid var(--border-strong); color: var(--text-2); white-space: nowrap; }
  .badge.primary { background: var(--primary-2); border-color: transparent; color: var(--primary-text); }
  .badge.danger { background: var(--danger-2); border-color: transparent; color: var(--danger); }
  .badge.success { background: var(--success-2); border-color: transparent; color: var(--primary-text); }
  .badge.warning { background: var(--warning-2); border-color: transparent; color: var(--warning); }
  .chip { display: inline-flex; align-items: center; gap: 6px; border: 1px dashed var(--border-strong); background: var(--surface); border-radius: 999px; padding: 4px 10px; font-size: 12.5px; font-weight: 500; cursor: pointer; color: var(--text-2); }
  .chip { white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
  .chip:hover { border-color: var(--primary); color: var(--primary-text); }
  .chip.on { border-style: solid; border-color: var(--primary); background: var(--primary-2); color: var(--primary-text); }
  .empty { text-align: center; color: var(--muted); padding: 40px 16px; }
  .empty .ico { width: 34px; height: 34px; margin-bottom: 8px; }
  .loading { display: flex; align-items: center; justify-content: center; gap: 10px; color: var(--muted); padding: 32px; }
  .spinner { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--border-strong); border-top-color: var(--primary); animation: spin .7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .error-box { background: var(--danger-2); color: var(--danger); border-radius: var(--radius-md); padding: 10px 12px; font-size: 13px; white-space: pre-wrap; word-break: break-word; }
  .note { background: var(--warning-2); color: var(--warning); border-radius: var(--radius-md); padding: 8px 12px; font-size: 13px; }
  .kv { display: grid; grid-template-columns: max-content 1fr; gap: 6px 14px; font-size: 13px; }
  .kv dt { color: var(--muted); }
  .kv dd { margin: 0; word-break: break-word; }

  /* ---- Tables view ---- */
  .split { display: flex; height: 100%; }
  .tlist { width: 100%; display: flex; flex-direction: column; min-height: 0; background: var(--surface); }
  .tdetail { flex: 1; min-width: 0; display: none; flex-direction: column; min-height: 0; }
  .split.has-detail .tlist { display: none; }
  .split.has-detail .tdetail { display: flex; }
  @media (min-width: 900px) {
    .tlist { width: 320px; flex: none; border-right: 1px solid var(--border); display: flex !important; }
    .tdetail { display: flex !important; }
    .only-narrow { display: none !important; }
  }
  .tlist-tools { padding: 12px; border-bottom: 1px solid var(--border); display: flex; flex-direction: column; gap: 8px; }
  .tlist-items { flex: 1; overflow: auto; -webkit-overflow-scrolling: touch; }
  .titem { display: flex; align-items: center; gap: 10px; padding: 9px 12px; min-height: 56px; border-bottom: 1px solid var(--border); cursor: pointer; transition: background-color .15s ease; }
  .titem:hover { background: var(--surface-2); }
  .titem.active { background: var(--surface-3); }
  .titem.active .t-name { color: var(--text); }
  .titem .t-ico { width: 32px; height: 32px; border-radius: var(--radius-sm); background: var(--surface-3); display: grid; place-items: center; color: var(--text-2); flex: none; }
  .titem.active .t-ico { background: var(--primary); color: var(--on-primary); }
  .titem .t-main { flex: 1; min-width: 0; }
  .titem .t-name { font-weight: 500; font-size: 14.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .titem .t-sub { font-family: var(--mono); font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .titem .t-meta { text-align: right; font-size: 12.5px; color: var(--text-2); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .titem .t-meta .muted { font-size: 12px; }
  .tgroup { padding: 10px 12px 6px; font-size: 12px; line-height: 16px; font-weight: 500; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); background: var(--surface); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 1; }
  .dhead { padding: 12px 14px; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .dhead h2 { margin: 0; font-size: 18px; line-height: 1.25; font-weight: 600; }
  .dhead .phys { font-family: var(--mono); font-size: 12px; color: var(--muted); }
  .dbody { flex: 1; min-height: 0; overflow: auto; -webkit-overflow-scrolling: touch; }
  .gridbar { display: flex; gap: 8px; align-items: center; padding: 10px 14px; flex-wrap: wrap; background: var(--surface); border-bottom: 1px solid var(--border); position: sticky; left: 0; }
  .gridbar .search { flex: 1; min-width: 180px; }
  .pager { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text-2); white-space: nowrap; font-variant-numeric: tabular-nums; }

  /* ---- Data grid ---- */
  .grid-wrap { overflow: auto; -webkit-overflow-scrolling: touch; }
  table.grid { border-collapse: separate; border-spacing: 0; font-size: 13px; min-width: 100%; }
  table.grid th, table.grid td { padding: 8px 12px; border-bottom: 1px solid var(--border); border-right: 1px solid var(--border); text-align: left; vertical-align: top; max-width: 320px; }
  table.grid th { position: sticky; top: 0; background: var(--surface); font-weight: 500; white-space: nowrap; z-index: 2; color: var(--muted); user-select: none; box-shadow: inset 0 -1px 0 var(--border); }
  table.grid th.sortable { cursor: pointer; }
  table.grid th.sortable:hover { color: var(--text); }
  table.grid th .th-in { display: flex; align-items: center; gap: 6px; }
  table.grid th .th-type { font-weight: 400; color: var(--muted); font-size: 12px; font-family: var(--mono); opacity: .8; }
  table.grid th.sorted { color: var(--primary-text); }
  table.grid td { background: var(--surface); }
  table.grid tbody tr { cursor: pointer; }
  table.grid tbody tr:hover td { background: var(--surface-2); }
  table.grid .rn { width: 1%; position: sticky; left: 0; z-index: 1; color: var(--muted); font-family: var(--mono); font-size: 12px; text-align: right; min-width: 44px; background: var(--surface); font-variant-numeric: tabular-nums; }
  table.grid th.rn { z-index: 3; }
  .c-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: block; max-width: 300px; }
  .c-num { font-family: var(--mono); color: var(--text-2); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .c-null { color: var(--null); font-style: italic; font-size: 12px; font-weight: 500; }
  .c-blob { display: inline-flex; gap: 5px; align-items: center; font-size: 12px; font-weight: 500; color: var(--warning); background: var(--warning-2); border-radius: 6px; padding: 0 6px; white-space: nowrap; }
  .c-more { color: var(--primary-text); font-size: 12px; font-weight: 500; margin-left: 4px; }

  /* ---- Structure ---- */
  table.plain { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.plain th, table.plain td { padding: 8px 10px; border-bottom: 1px solid var(--border); text-align: left; vertical-align: top; }
  table.plain th { font-size: 13px; color: var(--muted); font-weight: 500; }
  table.plain tr:last-child td { border-bottom: 0; }
  .tbl-scroll { overflow-x: auto; }
  pre.code {
    margin: 0; padding: 10px 12px; background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius-md);
    font-family: var(--mono); font-size: 12.5px; white-space: pre-wrap; word-break: break-word; overflow: auto;
  }
  .link { color: var(--primary-text); cursor: pointer; font-weight: 500; text-decoration: none; background: none; border: 0; padding: 0; }
  .link:hover { text-decoration: underline; text-underline-offset: 2px; }
  .pk { color: var(--warning); }

  /* ---- Syntax ---- */
  .hl-kw { color: var(--kw); font-weight: 600; }
  .hl-str { color: var(--str); }
  .hl-num { color: var(--num); }
  .hl-cmt { color: var(--cmt); font-style: italic; }
  .hl-param { color: var(--param); font-weight: 600; }
  .hl-id { color: var(--ident); }
  .hl-fn { color: var(--text); font-weight: 600; }

  /* ---- Query builder ---- */
  .qlayout { display: flex; flex-direction: column; gap: 12px; }

  }
  .qb-step { display: flex; gap: 10px; }
  .qb-num { width: 24px; height: 24px; border-radius: 50%; background: var(--primary-2); color: var(--primary-text); font-size: 12px; font-weight: 600; display: grid; place-items: center; flex: none; margin-top: 1px; font-variant-numeric: tabular-nums; }
  .qb-sec { padding: 14px; border-bottom: 1px solid var(--border); }
  .qb-sec:last-child { border-bottom: 0; }
  .qb-title { font-weight: 600; font-size: 14px; display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .qb-title .hint { font-weight: 400; color: var(--muted); font-size: 12.5px; }
  .qb-line { display: flex; gap: 6px; align-items: center; margin-bottom: 6px; flex-wrap: wrap; }

  .qb-line .x { flex: none; }
  .qb-group { border: 1px solid var(--border); border-radius: var(--radius-md); padding: 8px; margin: 6px 0; background: var(--surface-2); }
  .qb-group.nested { border-style: dashed; border-color: var(--border-strong); background: var(--surface); }
  .seg { display: inline-flex; background: var(--surface-3); border-radius: var(--radius-sm); padding: 2px; gap: 2px; }
  .seg button { border: 0; background: transparent; padding: 3px 10px; font-size: 12.5px; font-weight: 500; cursor: pointer; color: var(--text-2); border-radius: 6px; }
  .seg button.on { background: var(--surface); color: var(--primary-text); font-weight: 600; box-shadow: var(--shadow); }
  .join-box { border: 1px solid var(--border); border-radius: var(--radius-md); padding: 8px; margin-bottom: 8px; background: var(--surface-2); }
  .suggest { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
  .sqlprev { position: relative; }
  .sqlprev pre.code { max-height: 260px; }
  .alias { font-family: var(--mono); font-size: 12px; font-weight: 500; color: var(--primary-text); background: var(--primary-2); padding: 0 6px; border-radius: 5px; }

  /* ---- SQL editor ---- */
  .editor { position: relative; border: 1px solid var(--border-strong); border-radius: var(--radius-md); background: var(--surface); overflow: hidden; box-shadow: var(--shadow); }
  .editor:focus-within { border-color: var(--primary); box-shadow: 0 0 0 3px var(--ring); }
  .editor pre, .editor textarea {
    margin: 0; padding: 12px; font-family: var(--mono); font-size: 13px; line-height: 1.55; white-space: pre-wrap; word-break: break-word;

  }
  .editor pre { position: absolute; inset: 0; pointer-events: none; overflow: hidden; color: var(--text); }
  .editor textarea { position: relative; display: block; width: 100%; height: 220px; resize: vertical; border: 0; outline: none; background: transparent; color: transparent; caret-color: var(--text); }
  .editor textarea::selection { background: oklch(0.6 0.14 255 / 0.3); color: transparent; }
  .sugg-bar { display: flex; gap: 6px; overflow-x: auto; padding: 8px 0 2px; scrollbar-width: none; min-height: 40px; }
  .sugg-bar::-webkit-scrollbar { display: none; }
  .sugg { flex: none; border: 1px solid var(--border); background: var(--surface); border-radius: var(--radius-sm); padding: 4px 10px; font-family: var(--mono); font-size: 12.5px; cursor: pointer; display: flex; gap: 6px; align-items: center; }
  .sugg .k { font-family: var(--font); font-size: 12px; font-weight: 500; color: var(--muted); }
  .sugg:hover { border-color: var(--primary); }

  /* ---- Results ---- */
  .res-head { display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  .res-grid { max-height: 60vh; overflow: auto; }
  .plan { font-family: var(--mono); font-size: 12.5px; padding: 10px 14px; }
  .plan .node { padding: 3px 0; display: flex; gap: 6px; }
  .plan .node .scan { color: var(--danger); font-weight: 600; }
  .plan .node .search-i { color: var(--primary-text); font-weight: 600; }

  /* ---- Presets / history ---- */
  .plist { display: grid; gap: 12px; }
  @media (min-width: 900px) { .plist { grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); } }
  .plist > .card, .stats > .card { margin-top: 0; }
  .preset { padding: 14px; display: flex; flex-direction: column; gap: 8px; }
  .preset h3 { margin: 0; font-size: 15px; font-weight: 600; }
  .preset .desc { color: var(--text-2); font-size: 13px; }
  .preset pre.code { max-height: 84px; overflow: hidden; font-size: 12px; position: relative; }
  .hitem { padding: 10px 14px; border-bottom: 1px solid var(--border); cursor: pointer; }
  .hitem:hover { background: var(--surface-2); }
  .hitem pre { margin: 4px 0 0; font-family: var(--mono); font-size: 12.5px; white-space: pre-wrap; word-break: break-word; max-height: 60px; overflow: hidden; }

  /* ---- Info ---- */
  .stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
  .stat { padding: 14px; }
  .stat .v { font-size: 22px; font-weight: 600; line-height: 1.3; font-variant-numeric: tabular-nums; }
  .stat .l { font-size: 12px; line-height: 16px; color: var(--muted); font-weight: 500; text-transform: uppercase; letter-spacing: .08em; }
  .stat .s { font-size: 12.5px; color: var(--text-2); margin-top: 2px; }
  .bars { display: flex; flex-direction: column; gap: 8px; }
  .bar { cursor: pointer; }
  .bar .bl { display: flex; justify-content: space-between; gap: 10px; font-size: 13px; margin-bottom: 4px; }
  .bar .bt { height: 8px; border-radius: 99px; background: var(--surface-3); overflow: hidden; }
  .bar .bf { height: 100%; border-radius: 99px; background: var(--primary); }

  /* ---- Modal / sheet ---- */
  .overlay { position: fixed; inset: 0; background: var(--overlay); z-index: 100; display: flex; align-items: flex-end; justify-content: center; animation: fade .15s ease-out; }
  .sheet {
    background: var(--surface); width: 100%; max-height: 92vh; max-height: 92dvh; border-radius: var(--radius-xl) var(--radius-xl) 0 0; display: flex; flex-direction: column;
    box-shadow: var(--shadow-lg); animation: up .2s cubic-bezier(.2, .8, .2, 1); padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (min-width: 700px) {
    .overlay { align-items: center; padding: 24px; }
    .sheet { max-width: 560px; border-radius: var(--radius-xl); max-height: 85vh; border: 1px solid var(--border); }
    .sheet.wide { max-width: 980px; }
  }
  .sheet-h { display: flex; align-items: center; gap: 8px; padding: 12px 12px 12px 16px; border-bottom: 1px solid var(--border); }
  .sheet-h h3 { margin: 0; font-size: 16px; font-weight: 600; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sheet-b { padding: 16px; overflow: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; flex: 1; min-height: 0; }
  .sheet-f { display: flex; gap: 8px; justify-content: flex-end; padding: 12px 16px; border-top: 1px solid var(--border); flex-wrap: wrap; }
  .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
  .field label { font-size: 13px; font-weight: 500; color: var(--text-2); }
  .rv { padding: 8px 0; border-bottom: 1px solid var(--border); }
  .rv:last-child { border-bottom: 0; }
  .rv .rk { font-size: 12.5px; font-weight: 500; color: var(--muted); display: flex; align-items: center; gap: 6px; margin-bottom: 3px; }
  .rv .rval { font-family: var(--mono); font-size: 13px; white-space: pre-wrap; word-break: break-word; max-height: 220px; overflow: auto; }
  .dbitem { display: flex; gap: 12px; align-items: center; padding: 11px 8px; border-bottom: 1px solid var(--border); cursor: pointer; border-radius: var(--radius-sm); }
  .dbitem:last-child { border-bottom: 0; }
  .dbitem:hover { background: var(--surface-2); }
  .dbitem.disabled { opacity: .6; cursor: not-allowed; }
  .dbitem.sel { background: var(--surface-3); }
  .dbitem.sel .d-ico { background: var(--primary); color: var(--on-primary); }
  .d-ico { width: 38px; height: 38px; border-radius: var(--radius-md); background: var(--surface-3); display: grid; place-items: center; flex: none; color: var(--text-2); }
  .hexdump { font-family: var(--mono); font-size: 12px; line-height: 1.5; white-space: pre; overflow: auto; background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 10px; }
  .img-prev { max-width: 100%; max-height: 55vh; display: block; margin: 0 auto 10px; border-radius: var(--radius-sm); background: repeating-conic-gradient(var(--surface-3) 0 25%, var(--surface) 0 50%) 50% / 16px 16px; }
  .toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%) translateY(20px); background: var(--toast-bg); color: var(--toast-fg); padding: 10px 16px; border-radius: var(--radius-md); font-size: 13.5px; font-weight: 500; z-index: 200; opacity: 0; pointer-events: none; transition: opacity .2s ease-out, transform .2s ease-out; max-width: 90vw; box-shadow: var(--shadow-lg); }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  @media (max-width: 599px) { .only-wide-title { display: none; } }
  @keyframes fade { from { opacity: 0; } }
  @keyframes up { from { transform: translateY(30px); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) {
    .overlay, .sheet { animation-name: fade; }
    .toast { transition: opacity .2s ease-out; }
  }
</style>

        else if (JOINS[v] && !JOINS[prevKw] && out) brk = '\n';

  }

  // =========================================================================================
  // Cells
  // =========================================================================================
  /** OutSystems stores Binary Data attributes as base64 text — recognise the common formats. */
  var B64_SIGS = [['iVBORw0KGgo', 'image/png'], ['/9j/', 'image/jpeg'], ['R0lGOD', 'image/gif'], ['UklGR', 'image/webp'], ['Qk', 'image/bmp'], ['JVBERi0', 'application/pdf'], ['UEsDB', 'application/zip']];

    for (var i = 0; i < B64_SIGS.length; i++) if (s.indexOf(B64_SIGS[i][0]) === 0) return B64_SIGS[i][1];
    return null;
  }

    var txt = typeof v === 'string' ? v : v && v.$t === 'text' ? v.v : null;
    var bm = b64Mime(txt);
    if (bm) {
      var n = typeof v === 'string' ? v.length : v.len;
      return '<span class="c-blob" style="color:var(--primary-text);background:var(--primary-2)">BASE64 · ' + esc(bm.split('/')[1].toUpperCase()) + ' · ' + fmtBytes(Math.floor(n * 3 / 4)) + '</span>';
    }
    if (v === null || v === undefined) return '<span class="c-null">NULL</span>';
    if (typeof v === 'number') return '<span class="c-num">' + esc(v) + '</span>';
    if (typeof v === 'string') return v === '' ? '<span class="c-null">EMPTY</span>' : '<span class="c-text">' + esc(v.length > 200 ? v.slice(0, 200) : v) + '</span>';
    if (v.$t === 'blob') return '<span class="c-blob">BLOB · ' + fmtBytes(v.len) + (v.mime ? ' · ' + esc(v.mime.split('/')[1].toUpperCase()) : '') + '</span>';
    if (v.$t === 'text') return '<span class="c-text">' + esc(v.v.slice(0, 200)) + '</span><span class="c-more">+' + fmtNum(v.len - v.v.length) + ' chars</span>';

  }
  function cellPlain(v) {

  }

  /**
   * Builds one catalog of every table's columns (single query via table-valued pragmas) and a
   * list of references: declared foreign keys plus inferred ones — OutSystems local entities
   * carry no FK constraints, but reference attributes follow a <Entity>Id naming convention.
   */
  function loadCatalog() {
    var colsSql = 'SELECT m.name, p.cid, p.name, p.type, p.pk, p."notnull" FROM sqlite_master m JOIN pragma_table_info(m.name) p ' +
      "WHERE m.type IN ('table','view') ORDER BY m.name, p.cid";
    var fkSql = 'SELECT m.name, f."from", f."table", f."to" FROM sqlite_master m JOIN pragma_foreign_key_list(m.name) f WHERE m.type = \'table\'';
    var tables = {};
    S.ov.tables.forEach(function (t) { tables[t.name] = Object.assign({ cols: [] }, t); });
    var cols = api('query', { sql: colsSql, maxRows: 10000 }).then(function (r) {
      r.rows.forEach(function (x) { if (tables[x[0]]) tables[x[0]].cols.push({ name: x[2], type: x[3] || '', pk: x[4], notnull: x[5] }); });
    }).catch(function () {
      // Very old SQLite without table-valued pragmas: fall back to one call per table.
      return Promise.all(S.ov.tables.map(function (t) {
        return api('tableSchema', { table: t.name }).then(function (s) {
          tables[t.name].cols = s.columns.map(function (c) { return { name: c.name, type: c.type || '', pk: c.pk, notnull: c.notnull }; });
        }).catch(function () { });
      }));
    });
    var fks = api('query', { sql: fkSql, maxRows: 10000 }).then(function (r) { return r.rows; }).catch(function () { return []; });
    return Promise.all([cols, fks]).then(function (res) {
      var fkRows = res[1];
      var keyMap = {};
      var add = function (k, t) { k = String(k).toLowerCase(); if (k && !keyMap[k]) keyMap[k] = t; };
      var list = Object.keys(tables).map(function (k) { return tables[k]; });
      list.forEach(function (t) { if (t.logicalName) add(t.logicalName, t.name); });
      list.forEach(function (t) { add(t.name, t.name); var m = /^OSUSR_[^_]+_(.+)$/i.exec(t.name); if (m) add(m[1], t.name); });
      list.forEach(function (t) { if (t.logicalName && /^local/i.test(t.logicalName)) add(t.logicalName.slice(5), t.name); });
      var refs = [], seen = {};
      fkRows.forEach(function (f) {
        var k = f[0] + '.' + f[1];
        seen[k] = 1;
        var target = tables[f[2]];
        var to = f[3] || (target && pkOf(target));
        if (to) refs.push({ from: f[0], fromCol: f[1], to: f[2], toCol: to, kind: 'fk' });
      });
      list.forEach(function (t) {
        t.cols.forEach(function (c) {
          var m = /^(.+?)_?id$/i.exec(c.name);
          if (!m || seen[t.name + '.' + c.name] || c.pk) return;
          var key = m[1].toLowerCase();
          var target = keyMap[key] || keyMap['local' + key];
          if (!target || !tables[target]) return;
          var to = pkOf(tables[target]);
          if (!to || (target === t.name && to === c.name)) return;
          refs.push({ from: t.name, fromCol: c.name, to: target, toCol: to, kind: 'inferred' });
        });
      });
      var upper = {};
      list.forEach(function (t) { upper[t.name.toUpperCase()] = 1; t.cols.forEach(function (c) { upper[c.name.toUpperCase()] = 1; }); });
      S.cat = { tables: tables, refs: refs, upper: upper };
    });
  }
  function pkOf(t) {
    var pk = t.cols.filter(function (c) { return c.pk; })[0];
    if (pk) return pk.name;
    var id = t.cols.filter(function (c) { return c.name.toLowerCase() === 'id'; })[0];
    return id ? id.name : null;
  }
  function tableLabel(name) {
    var t = S.cat && S.cat.tables[name] || (S.ov && S.ov.tables.filter(function (x) { return x.name === name; })[0]);
    return t && t.logicalName ? t.logicalName : name;
  }

  // ---- Row / cell detail ------------------------------------------------------------------
  function rowSheet(columns, row, src) {
    var body = columns.map(function (c, i) {

      if (bm && canFetch) actions = '<button class="link small" data-cell="' + i + '">Preview ' + esc(bm.split('/')[1]) + '</button>';
      else if (v && typeof v === 'object' && canFetch) actions = '<button class="link small" data-cell="' + i + '">' + (v.$t === 'blob' ? 'Inspect blob' : 'Load full text') + '</button>';
      else if (v && typeof v === 'object') actions = '<span class="small muted">preview only</span>';

        '<div class="rval">' + (v === null || v === undefined ? '<span class="c-null">NULL</span>' : typeof v === 'number' ? '<span class="c-num">' + v + '</span>' :

              esc(v.v) + '<span class="c-more">… +' + fmtNum(v.len - v.v.length) + ' chars</span>') + '</div></div>';
    }).join('');

      }
    });
  }
  function prettyMaybeJson(s) {
    var t = s.trim();
    if ((t[0] === '{' || t[0] === '[') && t.length < 200000) {
      try { return JSON.stringify(JSON.parse(t), null, 2); } catch (e) { }
    }
    return s;
  }

  function cellModal(table, rowid, column) {

      } else if (c.text != null) {

          if (/^image\//.test(bm)) html += '<img class="img-prev" src="data:' + bm + ';base64,' + clean + '">';
          html += '<details><summary class="small muted" style="cursor:pointer;margin-bottom:6px">Raw text</summary><pre class="code" style="max-height:40vh">' + esc(c.text.slice(0, 20000)) + (c.text.length > 20000 ? '…' : '') + '</pre></details>';

          if (e.target.closest('[data-save]')) {
            var ext = c.mime ? '.' + c.mime.split('/')[1].replace('jpeg', 'jpg').replace('x-sqlite3', 'db') : '.bin';
            saveFile(table + '_' + column + '_' + rowid + ext, c.mime || 'application/octet-stream', c.base64, true);
          }

      }
    }).catch(function (e) { m.body.innerHTML = errorHtml(e); });
  }
  function hexDump(b64, max) {
    var bin = atob(b64), n = Math.min(bin.length, max), out = [];
    for (var o = 0; o < n; o += 16) {
      var hex = '', asc = '';
      for (var i = 0; i < 16; i++) {
        if (o + i < n) {
          var c = bin.charCodeAt(o + i);
          hex += (c < 16 ? '0' : '') + c.toString(16) + ' ';
          asc += c >= 32 && c < 127 ? bin[o + i] : '.';
        } else hex += '   ';
        if (i === 7) hex += ' ';
      }
      out.push(('00000000' + o.toString(16)).slice(-8) + '  ' + hex + ' ' + asc);
    }
    if (bin.length > max) out.push('… ' + fmtNum(bin.length - max) + ' more bytes');
    return out.join('\n');
  }

  // ---- Structure tab ----------------------------------------------------------------------
  function getSchema(table) {

      }).join('') + '</tbody></table>' : '<div class="muted small">No declared foreign keys.</div>';
      var trg = s.triggers.length ? s.triggers.map(function (t) { return '<div style="margin-bottom:8px"><div class="small" style="font-weight:600">' + esc(t.name) + '</div><pre class="code">' + highlight(t.sql || '') + '</pre></div>'; }).join('') : '<div class="muted small">No triggers.</div>';
      body.innerHTML = '<div class="pad">' +
        '<div class="card"><div class="card-h">' + icon('columns', 'sm') + 'Columns <span class="badge">' + s.columns.length + '</span>' + (s.logicalName ? '<span class="spacer"></span><span class="badge primary">OutSystems · ' + esc(s.logicalName) + '</span>' : '') + '</div>' +

        '<div class="card"><div class="card-h">' + icon('zap', 'sm') + 'Indexes <span class="badge">' + s.indexes.length + '</span></div><div class="card-b tbl-scroll">' + idx + '</div></div>' +
        '<div class="card"><div class="card-h">' + icon('link', 'sm') + 'Foreign keys</div><div class="card-b tbl-scroll">' + fks + '</div></div>' +
        '<div class="card"><div class="card-h">' + icon('zap', 'sm') + 'Triggers</div><div class="card-b">' + trg + '</div></div>' +
        '<div class="card"><div class="card-h">' + icon('code', 'sm') + 'DDL<span class="spacer"></span><button class="btn sm" data-act="copy-ddl">' + icon('copy', 'sm') + 'Copy</button></div><div class="card-b"><pre class="code">' + highlight(formatDdl(s.sql)) + '</pre></div></div>' +
        (s.rowid ? '' : '<div class="note" style="margin-top:12px">This ' + esc(s.type) + ' has no rowid, so large values can only be previewed, not fetched in full.</div>') +
        '</div>';
    }).catch(function (e) { body.innerHTML = '<div class="pad">' + errorHtml(e) + '</div>'; });
  }
  function formatDdl(sql) {
    if (!sql) return '';
    if (sql.indexOf('\n') >= 0) return sql;
    // Break the column list one-per-line for readability (only at top-level commas).
    var out = '', depth = 0, inStr = null;
    for (var i = 0; i < sql.length; i++) {
      var c = sql[i];
      if (inStr) { out += c; if (c === inStr) inStr = null; continue; }
      if (c === "'" || c === '"') { inStr = c; out += c; continue; }
      if (c === '(') { depth++; out += c + (depth === 1 ? '\n  ' : ''); continue; }
      if (c === ')') { depth--; out += (depth === 0 ? '\n' : '') + c; continue; }
      if (c === ',' && depth === 1) { out += ',\n '; continue; }
      out += c;
    }
    return out.replace(/\n  \s+/g, '\n  ');
  }

  function colStatsModal(table, column) {

        (s.avg != null ? statCard('Average', (Math.round(s.avg * 1000) / 1000).toLocaleString()) : '') +

      html += '<dl class="kv" style="margin-bottom:14px"><dt>Min</dt><dd class="mono">' + esc(s.min == null ? 'NULL' : s.min) + '</dd><dt>Max</dt><dd class="mono">' + esc(s.max == null ? 'NULL' : s.max) + '</dd>' +
        '<dt>Storage types</dt><dd>' + s.types.map(function (t) { return '<span class="badge">' + esc(t.type) + ' · ' + fmtNum(t.count) + '</span>'; }).join(' ') + '</dd></dl>';
      if (s.top && s.top.length) {

            '<div class="bt"><div class="bf" style="width:' + Math.max(2, t.count / max * 100) + '%"></div></div></div>';
        }).join('') + '</div><div class="small muted" style="margin-top:8px">Tap a value to filter the table by it in the query builder.</div>';
      }
      m.body.innerHTML = html;

      });
    }).catch(function (e) { m.body.innerHTML = errorHtml(e); });
  }

  // ---- Relations tab ----------------------------------------------------------------------

      '<div class="small muted" style="margin-top:10px">Inferred relations come from the <code>&lt;Entity&gt;Id</code> naming convention (OutSystems local entities have no declared foreign keys). Tap one to open it; the query builder uses them to suggest joins.</div></div>';
  }

  // =========================================================================================
  // Query builder
  // =========================================================================================
  var OPS = [
    ['=', 'equals'], ['!=', 'not equals'], ['>', 'greater than'], ['>=', 'greater or equal'], ['<', 'less than'], ['<=', 'less or equal'],
    ['contains', 'contains'], ['starts', 'starts with'], ['ends', 'ends with'], ['LIKE', 'LIKE pattern'], ['NOT LIKE', 'NOT LIKE'],
    ['IN', 'in list'], ['NOT IN', 'not in list'], ['BETWEEN', 'between'],
    ['IS NULL', 'is null'], ['IS NOT NULL', 'is not null'], ['EMPTY', 'is null or empty'], ['NOT EMPTY', 'has a value']
  ];
  var NO_VALUE = { 'IS NULL': 1, 'IS NOT NULL': 1, 'EMPTY': 1, 'NOT EMPTY': 1 };
  var AGGS = [['', '—'], ['COUNT', 'COUNT'], ['COUNT DISTINCT', 'COUNT DISTINCT'], ['SUM', 'SUM'], ['AVG', 'AVG'], ['MIN', 'MIN'], ['MAX', 'MAX'], ['GROUP_CONCAT', 'GROUP_CONCAT']];

  function newGroup() { return { kind: 'group', op: 'AND', items: [] }; }
  function newQb(table) {
    var qb = { from: null, joins: [], columns: [], distinct: false, where: newGroup(), groupBy: [], orderBy: [], limit: 100 };
    if (table) qb.from = { table: table, alias: makeAlias(table, []) };
    return qb;
  }
  function makeAlias(table, taken) {
    var label = tableLabel(table).replace(/^OSUSR_[^_]+_/i, '');
    var words = label.match(/[A-Z]+(?![a-z])|[A-Z]?[a-z]+|\d+/g) || [label];
    var a = words.map(function (w) { return w[0]; }).join('').toLowerCase().slice(0, 4) || 't';
    if (!/^[a-z_]/.test(a)) a = 't' + a;
    if (KW_SET[a.toUpperCase()]) a += '1';
    var base = a, i = 2;
    while (taken.indexOf(a) >= 0) a = base + i++;
    return a;
  }
  function qbScope(qb) {
    var s = [];
    if (qb.from && qb.from.table) s.push(qb.from);
    qb.joins.forEach(function (j) { if (j.table) s.push(j); });
    return s;
  }
  function colRef(ref) {
    if (!ref) return '';
    var dot = ref.indexOf('.');
    return dot < 0 ? qi(ref) : ref.slice(0, dot) + '.' + qi(ref.slice(dot + 1));
  }
  function condSql(c) {
    if (!c.col) return '';
    var col = colRef(c.col), v = c.v == null ? '' : String(c.v);
    var isParam = /^[:@$][A-Za-z_]\w*$/.test(v.trim());
    var like = function (pre, post) { return isParam ? (pre ? "'%' || " : '') + v.trim() + (post ? " || '%'" : '') : lit(pre + v.replace(/^'|'$/g, '') + post); };
    switch (c.opr) {
      case 'IS NULL': return col + ' IS NULL';
      case 'IS NOT NULL': return col + ' IS NOT NULL';
      case 'EMPTY': return '(' + col + " IS NULL OR " + col + " = '')";
      case 'NOT EMPTY': return '(' + col + " IS NOT NULL AND " + col + " <> '')";
      case 'contains': return col + ' LIKE ' + like('%', '%');
      case 'starts': return col + ' LIKE ' + like('', '%');
      case 'ends': return col + ' LIKE ' + like('%', '');
      case 'IN': case 'NOT IN':
        var items = v.split(',').map(function (x) { return x.trim(); }).filter(function (x) { return x !== ''; });
        return items.length ? col + ' ' + c.opr + ' (' + items.map(lit).join(', ') + ')' : '';
      case 'BETWEEN': return v === '' || c.v2 == null || c.v2 === '' ? '' : col + ' BETWEEN ' + lit(v) + ' AND ' + lit(c.v2);
      default: return v === '' ? '' : col + ' ' + c.opr + ' ' + lit(v);
    }
  }
  function groupSql(g, nested) {
    var parts = g.items.map(function (it) { return it.kind === 'group' ? groupSql(it, true) : condSql(it); }).filter(Boolean);
    if (!parts.length) return '';
    var s = parts.join(nested ? ' ' + g.op + ' ' : '\n  ' + g.op + ' ');
    return nested && parts.length > 1 ? '(' + s + ')' : s;
  }
  function qbToSql(qb) {
    if (!qb.from || !qb.from.table) return '';
    var cols = qb.columns.filter(function (c) { return c.expr; }).map(function (c) {
      var e = c.expr === '*' ? '*' : /\.\*$/.test(c.expr) ? c.expr : colRef(c.expr);
      if (c.agg === 'COUNT DISTINCT') e = 'COUNT(DISTINCT ' + e + ')';
      else if (c.agg) e = c.agg + '(' + e + ')';
      return e + (c.alias ? ' AS ' + qi(c.alias) : '');
    });
    var sql = 'SELECT ' + (qb.distinct ? 'DISTINCT ' : '') + (cols.length ? cols.join(',\n       ') : '*') +
      '\nFROM ' + qi(qb.from.table) + ' AS ' + qb.from.alias;
    qb.joins.forEach(function (j) {
      if (!j.table) return;
      var on = j.on.filter(function (o) { return o.l && o.r; }).map(function (o) { return colRef(o.l) + ' = ' + colRef(o.r); });
      sql += '\n' + (j.type || 'LEFT') + ' JOIN ' + qi(j.table) + ' AS ' + j.alias + (on.length ? ' ON ' + on.join(' AND ') : j.type === 'CROSS' ? '' : ' ON 1 = 1');
    });
    var w = groupSql(qb.where);
    if (w) sql += '\nWHERE ' + w;
    var gb = qb.groupBy.filter(Boolean).map(colRef);
    if (gb.length) sql += '\nGROUP BY ' + gb.join(', ');
    var ob = qb.orderBy.filter(function (o) { return o.col; }).map(function (o) { return (o.col.indexOf('.') < 0 ? qi(o.col) : colRef(o.col)) + ' ' + (o.dir || 'ASC'); });
    if (ob.length) sql += '\nORDER BY ' + ob.join(', ');
    if (qb.limit) sql += '\nLIMIT ' + (+qb.limit || 100);
    return sql;
  }

  function colOptions(qb, selected, opts) {
    opts = opts || {};
    var html = '<option value="">' + esc(opts.placeholder || 'Column…') + '</option>';
    if (opts.star) html += '<option value="*"' + (selected === '*' ? ' selected' : '') + '>* (all columns)</option>';
    if (opts.aliases) {
      qb.columns.forEach(function (c) { if (c.alias) html += '<option value="' + esc(c.alias) + '"' + (selected === c.alias ? ' selected' : '') + '>' + esc(c.alias) + ' (alias)</option>'; });
    }
    qbScope(qb).forEach(function (s) {
      var t = S.cat.tables[s.table];
      if (!t) return;
      html += '<optgroup label="' + esc(s.alias + ' — ' + tableLabel(s.table)) + '">';
      if (opts.star) html += '<option value="' + esc(s.alias) + '.*"' + (selected === s.alias + '.*' ? ' selected' : '') + '>' + esc(s.alias) + '.*</option>';
      t.cols.forEach(function (c) {
        var v = s.alias + '.' + c.name;
        html += '<option value="' + esc(v) + '"' + (selected === v ? ' selected' : '') + '>' + esc(s.alias + '.' + c.name) + (c.type ? '  · ' + esc(c.type.toLowerCase()) : '') + '</option>';
      });
      html += '</optgroup>';
    });
    return html;
  }
  function tableOptions(selected) {
    var list = S.ov.tables.slice().sort(function (a, b) { return (a.system - b.system) || tableLabel(a.name).localeCompare(tableLabel(b.name)); });
    var html = '<option value="">Choose a table…</option>', sys = false;
    list.forEach(function (t) {
      if (t.system && !sys) { html += '<optgroup label="System">'; sys = true; }
      html += '<option value="' + esc(t.name) + '"' + (selected === t.name ? ' selected' : '') + '>' + esc(t.logicalName ? t.logicalName + ' (' + t.name + ')' : t.name) + (t.rows != null ? ' · ' + fmtNum(t.rows) : '') + '</option>';
    });
    return html + (sys ? '</optgroup>' : '');
  }

  function joinSuggestions(qb) {
    var scope = qbScope(qb), inScope = {}, out = [];
    scope.forEach(function (s) { inScope[s.table] = s.alias; });
    S.cat.refs.forEach(function (r) {
      if (inScope[r.from] && !inScope[r.to]) out.push({ table: r.to, l: inScope[r.from] + '.' + r.fromCol, rc: r.toCol, label: tableLabel(r.to), via: r.fromCol, kind: r.kind });
      else if (inScope[r.to] && !inScope[r.from]) out.push({ table: r.from, l: inScope[r.to] + '.' + r.toCol, rc: r.fromCol, label: tableLabel(r.from), via: r.fromCol, kind: r.kind, reverse: true });
    });
    return out.slice(0, 12);
  }

  function condHtml(c, path, qb) {
    var ops = OPS.map(function (o) { return '<option value="' + esc(o[0]) + '"' + (c.opr === o[0] ? ' selected' : '') + '>' + esc(o[1]) + '</option>'; }).join('');
    var val = NO_VALUE[c.opr] ? '' : '<input class="input" data-qb="' + path + '.v" value="' + esc(c.v || '') + '" placeholder="' + (c.opr === 'IN' || c.opr === 'NOT IN' ? 'a, b, c' : 'value or :param') + '" autocapitalize="off" spellcheck="false">' +
      (c.opr === 'BETWEEN' ? '<span class="muted small">and</span><input class="input" data-qb="' + path + '.v2" value="' + esc(c.v2 || '') + '" placeholder="value">' : '');
    return '<div class="qb-line"><select class="input" data-qb="' + path + '.col">' + colOptions(qb, c.col) + '</select>' +
      '<select class="input narrow" data-qb="' + path + '.opr" style="flex:0 1 150px">' + ops + '</select>' + val +
      '<button class="icon-btn x" data-act="qb-del" data-path="' + path + '">' + icon('x', 'sm') + '</button></div>';
  }
  function groupHtml(g, path, qb, depth) {
    var items = g.items.map(function (it, i) {
      var p = path + '.items.' + i;
      return it.kind === 'group' ? groupHtml(it, p, qb, depth + 1) : condHtml(it, p, qb);
    }).join('');
    return '<div class="qb-group' + (depth ? ' nested' : '') + '"><div class="row" style="margin-bottom:6px">' +
      '<span class="small muted">Match</span><div class="seg"><button data-act="qb-set" data-path="' + path + '.op" data-val="AND" class="' + (g.op === 'AND' ? 'on' : '') + '">ALL</button>' +
      '<button data-act="qb-set" data-path="' + path + '.op" data-val="OR" class="' + (g.op === 'OR' ? 'on' : '') + '">ANY</button></div>' +
      '<span class="spacer"></span>' + (depth ? '<button class="icon-btn x" data-act="qb-del" data-path="' + path + '">' + icon('trash', 'sm') + '</button>' : '') + '</div>' +
      (items || '<div class="small muted" style="padding:2px 0 6px">No conditions — all rows match.</div>') +
      '<div class="row wrap"><button class="btn sm" data-act="qb-add-cond" data-path="' + path + '">' + icon('plus', 'sm') + 'Condition</button>' +
      (depth < 2 ? '<button class="btn sm ghost" data-act="qb-add-group" data-path="' + path + '">' + icon('plus', 'sm') + 'Group</button>' : '') + '</div></div>';

  function builderHtml(qb) {
    var sec = function (n, title, hint, body) {
      return '<div class="qb-sec"><div class="qb-step"><div class="qb-num">' + n + '</div><div style="flex:1;min-width:0"><div class="qb-title">' + title +

    }

        return '<div class="qb-line"><select class="input" data-qb="' + p + '.on.' + k + '.l">' + colOptions(qb, o.l) + '</select><span class="muted">=</span>' +
          '<select class="input" data-qb="' + p + '.on.' + k + '.r">' + colOptions(qb, o.r) + '</select>' +
          (j.on.length > 1 ? '<button class="icon-btn x" data-act="qb-del" data-path="' + p + '.on.' + k + '">' + icon('x', 'sm') + '</button>' : '') + '</div>';
      }).join('');
      return '<div class="join-box"><div class="qb-line"><select class="input narrow" data-qb="' + p + '.type" style="flex:0 0 96px">' +
        ['LEFT', 'INNER', 'CROSS'].map(function (t) { return '<option' + (j.type === t ? ' selected' : '') + '>' + t + '</option>'; }).join('') + '</select>' +
        '<select class="input" data-qb="' + p + '.table">' + tableOptions(j.table) + '</select>' + (j.table ? '<span class="alias">' + esc(j.alias) + '</span>' : '') +
        '<button class="icon-btn x" data-act="qb-del" data-path="' + p + '">' + icon('trash', 'sm') + '</button></div>' +

      }).join('') + '</div>';

    var cols = qb.columns.map(function (c, i) {
      var p = 'columns.' + i;

        AGGS.map(function (a) { return '<option value="' + a[0] + '"' + (c.agg === a[0] ? ' selected' : '') + '>' + a[1] + '</option>'; }).join('') + '</select>' +
        '<select class="input" data-qb="' + p + '.expr">' + colOptions(qb, c.expr, { star: true }) + '</select>' +
        '<input class="input narrow" style="flex:0 1 110px" data-qb="' + p + '.alias" value="' + esc(c.alias || '') + '" placeholder="alias" autocapitalize="off" spellcheck="false">' +
        '<button class="icon-btn x" data-act="qb-del" data-path="' + p + '">' + icon('x', 'sm') + '</button></div>';
    }).join('');
    var hasAgg = qb.columns.some(function (c) { return c.agg; });
    var plain = qb.columns.filter(function (c) { return !c.agg && c.expr && c.expr.indexOf('*') < 0; }).map(function (c) { return c.expr; });
    var missing = plain.filter(function (e) { return qb.groupBy.indexOf(e) < 0; });

      '<div class="row wrap"><button class="btn sm" data-act="qb-add-col">' + icon('plus', 'sm') + 'Column</button>' +
      '<button class="btn sm ghost" data-act="qb-add-count">' + icon('plus', 'sm') + 'COUNT(*)</button>' +
      '<label class="row small" style="gap:6px;margin-left:auto"><input type="checkbox" data-qb="distinct"' + (qb.distinct ? ' checked' : '') + '> DISTINCT</label></div>' +
      (hasAgg && missing.length ? '<div class="note" style="margin-top:8px">Non-aggregated columns should be grouped. <button class="link" data-act="qb-autogroup">Group by ' + esc(missing.join(', ')) + '</button></div>' : '');

        '<button class="icon-btn x" data-act="qb-del" data-path="orderBy.' + i + '">' + icon('x', 'sm') + '</button></div>';

      [10, 100, 1000].map(function (n) { return '<button class="chip' + (+qb.limit === n ? ' on' : '') + '" data-act="qb-set" data-path="limit" data-val="' + n + '">' + n + '</button>'; }).join('') + '</div>';

    return '<div class="card">' +
      sec(1, 'From', '', from) +
      sec(2, 'Join', 'combine related tables', joins) +
      sec(3, 'Columns', 'pick, aggregate, rename', cols) +
      sec(4, 'Filter', 'use <code>:name</code> for a parameter', groupHtml(qb.where, 'where', qb, 0)) +
      sec(5, 'Group', '', gb) +

  function getPath(obj, path) {
    return path.split('.').reduce(function (o, k) { return o == null ? o : o[k]; }, obj);
  }
  function setPath(obj, path, val) {
    var ks = path.split('.'), last = ks.pop();
    var target = ks.reduce(function (o, k) { return o[k]; }, obj);
    target[last] = val;
  }
  function delPath(obj, path) {
    var ks = path.split('.'), last = ks.pop();
    var target = ks.reduce(function (o, k) { return o[k]; }, obj);
    if (Array.isArray(target)) target.splice(+last, 1); else delete target[last];
  }

  function onQbChange(path, value, rerender) {
    var qb = S.qb;
    if (path === 'from.table') {
      var keepWhere = qb.from && qb.from.table === value;
      S.qb = newQb(value || null);
      if (keepWhere) S.qb.where = qb.where;
    } else if (/^joins\.\d+\.table$/.test(path)) {
      var i = +path.split('.')[1], j = qb.joins[i];
      j.table = value;
      var taken = qbScope(qb).filter(function (s) { return s !== j; }).map(function (s) { return s.alias; });
      j.alias = value ? makeAlias(value, taken) : '';
      j.on = [autoOn(qb, j)];
    } else if (path === 'distinct') {
      qb.distinct = value;
    } else if (path === 'limit') {
      qb.limit = value === '' ? null : +value;
    } else {
      setPath(qb, path, value);
    }
    if (rerender) renderBuilderBody(); else updateSqlPreview();
  }
  /** Best ON clause for a newly joined table, from known references in either direction. */
  function autoOn(qb, j) {
    var scope = qbScope(qb).filter(function (s) { return s !== j; });
    for (var i = 0; i < S.cat.refs.length; i++) {
      var r = S.cat.refs[i];
      for (var k = 0; k < scope.length; k++) {
        var s = scope[k];
        if (r.from === s.table && r.to === j.table) return { l: s.alias + '.' + r.fromCol, r: j.alias + '.' + r.toCol };
        if (r.from === j.table && r.to === s.table) return { l: s.alias + '.' + r.toCol, r: j.alias + '.' + r.fromCol };
      }
    }
    return { l: '', r: '' };
  }

  function startBuilderFor(table, conds) {
    S.qb = newQb(table);
    (conds || []).forEach(function (c) {
      S.qb.where.items.push({ kind: 'cond', col: S.qb.from.alias + '.' + c.name, opr: c.opr, v: c.v });
    });
    S.view = 'query';
    S.qTab = 'builder';
    render();
    if (conds && conds.length) runSql(qbToSql(S.qb));
  }

  // =========================================================================================
  // Query view (builder + SQL editor + results + history)

      return '<button class="subtab' + (S.qTab === t[0] ? ' active' : '') + '" data-act="q-tab" data-tab="' + t[0] + '">' + icon(t[1], 'sm') + t[2] + '</button>';
    }).join('') + '</div><span class="spacer"></span><span class="small muted">' + icon('shield', 'sm') + ' read-only connection</span></div>' +
      '<div class="qlayout' + (S.qTab === 'history' ? '' : ' two') + '"><div id="qmain"></div><div class="qresult-col" id="qresult"></div></div></div>';

  }

  function renderBuilderBody() {

      '<button class="btn sm ghost" data-act="qb-reset">' + icon('refresh', 'sm') + 'Reset</button></div><div class="card-b">' +
      '<pre class="code" id="qbsql">' + (sql ? highlight(sql) : '<span class="muted">Choose a table to begin.</span>') + '</pre>' +
      '<div class="row wrap" style="margin-top:10px"><button class="btn primary" data-act="qb-run"' + (sql ? '' : ' disabled') + '>' + icon('play', 'sm') + 'Run</button>' +
      '<button class="btn" data-act="qb-explain"' + (sql ? '' : ' disabled') + '>' + icon('zap', 'sm') + 'Explain</button>' +
      '<button class="btn" data-act="qb-to-sql"' + (sql ? '' : ' disabled') + '>' + icon('edit', 'sm') + 'Edit as SQL</button>' +
      '<button class="btn" data-act="qb-save"' + (sql ? '' : ' disabled') + '>' + icon('star', 'sm') + 'Save preset</button></div></div></div>';
    view.scrollTop = scrollY;
  }
  function updateSqlPreview() {
    var pre = $('#qbsql');

  }

  // ---- SQL editor ---------------------------------------------------------------------------
  function renderEditor() {
    var main = $('#qmain');
    main.innerHTML = '<div class="card"><div class="card-b">' +
      '<div class="editor"><pre id="hl" aria-hidden="true"></pre><textarea id="sqlta" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off" placeholder="SELECT * FROM …"></textarea></div>' +
      '<div class="sugg-bar" id="sugg"></div>' +
      '<div class="row wrap" style="margin-top:6px"><button class="btn primary" data-act="sql-run">' + icon('play', 'sm') + 'Run</button>' +
      '<button class="btn" data-act="sql-explain">' + icon('zap', 'sm') + 'Explain</button>' +
      '<button class="btn" data-act="sql-format">' + icon('wand', 'sm') + 'Format</button>' +
      '<button class="btn" data-act="sql-save">' + icon('star', 'sm') + 'Save preset</button>' +
      '<button class="btn ghost" data-act="sql-clear">' + icon('trash', 'sm') + 'Clear</button></div>' +
      '<div class="small muted" style="margin-top:8px">Tip: <code>:name</code> placeholders become parameters you fill in when running. ' +
      '<span class="nowrap">⌘/Ctrl + Enter runs.</span></div></div></div>';

    };

    ta.addEventListener('click', suggest);

    ta.addEventListener('keydown', function (e) {
      if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') { e.preventDefault(); runSql(ta.value); }
      else if (e.key === 'Tab') {
        e.preventDefault();

    if (window.ResizeObserver) new ResizeObserver(function () { hl.style.height = ta.offsetHeight + 'px'; }).observe(ta);
    sync();
    suggest();
  }

  /** Context-aware completion chips: columns after "alias.", tables after FROM/JOIN, else a mix. */
  function suggest() {
    var ta = $('#sqlta'), bar = $('#sugg');
    if (!ta || !bar || !S.cat) return;
    var pos = ta.selectionStart, before = ta.value.slice(0, pos);
    var m = /([A-Za-z_][A-Za-z0-9_]*)\.([A-Za-z0-9_]*)$/.exec(before);
    var word = m ? m[2] : (/([A-Za-z0-9_]*)$/.exec(before) || ['', ''])[1];
    var w = word.toLowerCase();
    var items = [];
    var aliases = parseAliases(ta.value);
    if (m) {
      var t = aliases[m[1].toLowerCase()] || (S.cat.tables[m[1]] ? m[1] : null);
      if (t && S.cat.tables[t]) S.cat.tables[t].cols.forEach(function (c) { if (!w || c.name.toLowerCase().indexOf(w) === 0) items.push({ k: 'col', v: c.name, ins: qi(c.name) }); });
    } else {
      var prevKw = (/(FROM|JOIN|INTO|UPDATE|TABLE)\s+[A-Za-z0-9_"]*$/i.exec(before) || [])[1];
      var tables = Object.keys(S.cat.tables).map(function (k) { return S.cat.tables[k]; });
      var tItems = [];
      tables.forEach(function (t) {
        var hit = !w || t.name.toLowerCase().indexOf(w) >= 0 || (t.logicalName || '').toLowerCase().indexOf(w) >= 0;
        if (hit && (prevKw || w.length >= 1)) tItems.push({ k: t.type === 'view' ? 'view' : 'table', v: t.logicalName || t.name, ins: qi(t.name) + (prevKw ? ' AS ' + makeAlias(t.name, Object.keys(aliases)) : '') });
      });
      if (prevKw) items = tItems;
      else {
        var scoped = Object.keys(aliases).map(function (a) { return { a: a, t: aliases[a] }; });
        scoped.forEach(function (s) {
          (S.cat.tables[s.t] ? S.cat.tables[s.t].cols : []).forEach(function (c) {
            if (w && c.name.toLowerCase().indexOf(w) === 0) items.push({ k: s.a, v: s.a + '.' + c.name, ins: s.a + '.' + qi(c.name) });
          });
        });
        if (w) KEYWORDS.forEach(function (k) { if (k.toLowerCase().indexOf(w) === 0 && k.length > w.length) items.push({ k: 'kw', v: k, ins: k }); });
        if (w) FUNCS.forEach(function (f) { if (f.indexOf(w) === 0 && f.length > w.length) items.push({ k: 'fn', v: f + '()', ins: f + '(' }); });
        items = items.concat(tItems.slice(0, 8));
        if (!w) items = ['SELECT', 'FROM', 'WHERE', 'JOIN', 'GROUP BY', 'ORDER BY', 'LIMIT', 'COUNT(*)', 'LIKE', 'AND'].map(function (k) { return { k: 'kw', v: k, ins: k }; });
      }
    }
    items = items.slice(0, 30);
    bar.innerHTML = items.map(function (it, i) { return '<button class="sugg" data-i="' + i + '"><span class="k">' + esc(it.k) + '</span>' + esc(it.v) + '</button>'; }).join('');
    bar.onclick = function (e) {
      var b = e.target.closest('.sugg');
      if (!b) return;
      var it = items[+b.getAttribute('data-i')];
      var start = pos - word.length;
      ta.focus();
      ta.setRangeText(it.ins + (/\($/.test(it.ins) ? '' : ' '), start, pos, 'end');
      S.sql = ta.value;
      ta.dispatchEvent(new Event('input'));
    };
  }
  function parseAliases(sql) {
    var map = {}, toks = tokenize(sql).filter(function (t) { return t.t !== 'ws' && t.t !== 'cmt'; });
    for (var i = 0; i < toks.length; i++) {
      var t = toks[i];
      if (t.t === 'kw' && /^(FROM|JOIN)$/i.test(t.v)) {
        var n = toks[i + 1];
        if (!n || (n.t !== 'id' && n.t !== 'qid')) continue;
        var name = n.t === 'qid' ? n.v.slice(1, -1).replace(/""/g, '"') : n.v;
        var real = Object.keys(S.cat.tables).filter(function (k) { return k.toLowerCase() === name.toLowerCase(); })[0];
        if (!real) continue;
        var a = toks[i + 2], alias = null;
        if (a && a.t === 'kw' && a.v.toUpperCase() === 'AS') a = toks[i + 3];
        if (a && a.t === 'id') alias = a.v;
        map[(alias || name).toLowerCase()] = real;
        if (alias) map[name.toLowerCase()] = real;
      }
    }
    return map;
  }

  // ---- Running --------------------------------------------------------------------------------
  function runSql(sql, opts) {
    opts = opts || {};
    sql = (sql || '').trim();
    if (!sql) { toast('Nothing to run'); return; }
    var params = extractParams(sql);
    if (params.length && !opts.bound) {
      paramModal(params, function (values) { runSql(bindParams(sql, values), Object.assign({}, opts, { bound: true, original: sql })); });
      return;
    }
    var exec = opts.explain ? 'EXPLAIN QUERY PLAN ' + sql : sql;
    S.running = true;
    S.result = { sql: sql, running: true, explain: !!opts.explain };
    renderResult();
    var started = Date.now();
    api('query', { sql: exec, maxRows: S.maxRows }).then(function (r) {
      S.result = Object.assign({ sql: sql, explain: !!opts.explain }, r);
      if (!opts.explain) addHistory({ sql: opts.original || sql, rows: r.rows.length, ms: r.timeMs, ok: true });
    }).catch(function (e) {
      S.result = { sql: sql, error: e.message, explain: !!opts.explain };
      if (!opts.explain) addHistory({ sql: opts.original || sql, ok: false, error: e.message, ms: Date.now() - started });
    }).then(function () {
      S.running = false;
      renderResult();
      if (isNarrow()) { var r = $('#qresult'); if (r) r.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
    });
  }

  function paramModal(params, cb) {

      }).join('') + '<div class="small muted">Numbers are used as-is; anything else is quoted as text. Type <code>null</code> for NULL.</div>',
      footer: '<button class="btn" data-close>Cancel</button><button class="btn primary" data-ok>' + icon('play', 'sm') + 'Run</button>',
      onOpen: function (mm) { setTimeout(function () { var f = mm.el.querySelector('input'); if (f) f.focus(); }, 50); }
    });
    var go = function () {
      var values = {};
      $$('[data-p]', m.el).forEach(function (i) { values[i.getAttribute('data-p')] = i.value; });
      S.prefs.params = Object.assign({}, saved, values); savePrefs();
      m.close();
      cb(values);
    };
    m.el.querySelector('[data-ok]').addEventListener('click', go);
    m.el.addEventListener('keydown', function (e) { if (e.key === 'Enter') go(); });

  function renderResult() {
    var el = $('#qresult');
    if (!el) return;
    var r = S.result;
    if (!r) {
      el.innerHTML = '<div class="card"><div class="empty">' + icon('play') + '<div>Run a query to see results here.</div></div></div>';
      return;
    }
    if (r.running) {
      el.innerHTML = '<div class="card"><div class="loading"><div class="spinner"></div>Running…<button class="btn sm" data-act="interrupt">' + icon('stop', 'sm') + 'Cancel</button></div></div>';
      return;
    }
    if (r.error) {
      el.innerHTML = '<div class="card"><div class="card-h">' + icon('x', 'sm') + 'Query failed</div><div class="card-b">' + errorHtml(r.error) +
        (/readonly|read-only/i.test(r.error) ? '<div class="small muted" style="margin-top:8px">The inspector opens every database read-only, so it can never change the app’s data.</div>' : '') + '</div></div>';
      return;
    }
    if (r.explain) {
      el.innerHTML = '<div class="card"><div class="card-h">' + icon('zap', 'sm') + 'Query plan</div>' + planHtml(r) +
        '<div class="card-b small muted" style="border-top:1px solid var(--border)"><b style="color:var(--danger)">SCAN</b> reads the whole table; <b style="color:var(--success)">SEARCH … USING INDEX</b> jumps straight to matching rows.</div></div>';
      return;
    }
    el.innerHTML = '<div class="card"><div class="res-head"><b>' + fmtNum(r.rows.length) + (r.hasMore ? '+' : '') + ' rows</b><span class="muted small">' + (Math.round(r.timeMs * 10) / 10) + ' ms</span>' +
      (r.hasMore ? '<span class="badge warning">first ' + fmtNum(r.rows.length) + '</span>' : '') + '<span class="spacer"></span>' +
      '<select class="input" id="maxrows" style="width:auto;min-height:28px;padding:2px 26px 2px 8px;font-size:12px">' + [100, 1000, 5000].map(function (n) { return '<option value="' + n + '"' + (S.maxRows === n ? ' selected' : '') + '>max ' + fmtNum(n) + '</option>'; }).join('') + '</select>' +
      '<button class="btn sm" data-act="res-csv">' + icon('download', 'sm') + 'CSV</button><button class="btn sm" data-act="res-json">' + icon('download', 'sm') + 'JSON</button>' +
      '<button class="btn sm" data-act="res-copy">' + icon('copy', 'sm') + 'Copy</button></div>' +
      (r.rows.length ? '<div class="res-grid">' + gridHtml({ columns: r.columns, rows: r.rows, rowAct: 'res-row' }) + '</div>' :
        '<div class="empty">' + icon('search') + '<div>' + (r.columns.length ? 'No rows returned.' : 'Statement executed.') + '</div></div>') + '</div>';
    var mr = $('#maxrows');
    if (mr) mr.addEventListener('change', function (e) { S.maxRows = +e.target.value; runSql(r.sql); });
  }
  function planHtml(r) {
    var byId = {}, roots = [];
    r.rows.forEach(function (row) { var n = { id: row[0], parent: row[1], detail: row[r.columns.length - 1], kids: [] }; byId[n.id] = n; });
    Object.keys(byId).forEach(function (k) { var n = byId[k]; if (byId[n.parent]) byId[n.parent].kids.push(n); else roots.push(n); });
    var walk = function (n, d) {
      var det = esc(n.detail).replace(/^(SCAN)/, '<span class="scan">$1</span>').replace(/^(SEARCH)/, '<span class="search-i">$1</span>');
      return '<div class="node" style="padding-left:' + d * 18 + 'px">' + (d ? '└ ' : '') + det + '</div>' + n.kids.map(function (k) { return walk(k, d + 1); }).join('');
    };
    return '<div class="plan">' + (roots.map(function (n) { return walk(n, 0); }).join('') || '<span class="muted">No plan returned.</span>') + '</div>';
  }
  function resultCsv(r) {
    var q = function (s) { s = cellPlain(s); return /[",\n\r;]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
    return [r.columns.map(q).join(',')].concat(r.rows.map(function (row) { return row.map(q).join(','); })).join('\n');
  }
  function resultJson(r) {

  /** Merge by id (then by name + sql) — incoming wins when it is newer. */
  function mergePresets(incoming) {
    var stats = { added: 0, updated: 0, skipped: 0, invalid: 0 };

      var p = normalizePreset(raw);

      var idx = -1;
      S.presets.forEach(function (x, i) { if (x.id === p.id || (x.name === p.name && x.sql === p.sql)) idx = i; });
      if (idx < 0) { S.presets.push(p); stats.added++; }
      else if (p.updatedAt > S.presets[idx].updatedAt || S.presets[idx].sql !== p.sql) { p.id = S.presets[idx].id; S.presets[idx] = p; stats.updated++; }
