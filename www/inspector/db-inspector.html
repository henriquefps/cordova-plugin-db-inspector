        render();
      } catch (e) {
        $('#ierr', m.el).innerHTML = errorHtml(e);
      }
    };
    m.el.querySelector('[data-pick]').addEventListener('click', function () {
      Bridge.call('pickFile').then(function (r) {
        if (!r || r.cancelled) return;
        $('#ij', m.el).value = r.text;
        doImport(r.text);
      }).catch(function (e) { $('#ierr', m.el).innerHTML = errorHtml(e); });
    });
    m.el.querySelector('[data-ok]').addEventListener('click', function () { doImport($('#ij', m.el).value); });
  }

  function openPreset(p, run) {
    var usable = p.builder && p.builder.from && S.cat.tables[p.builder.from.table] &&
      p.builder.joins.every(function (j) { return !j.table || S.cat.tables[j.table]; });
    S.view = 'query';
    if (usable) { S.qb = clone(p.builder); S.qTab = 'builder'; }
    else { S.sql = p.sql; S.qTab = 'sql'; }
    render();
    if (run) runSql(p.sql);
  }

  // =========================================================================================
  // Info view
  // =========================================================================================
  function renderInfo() {
    view.innerHTML = '<div class="pad" id="info">' + loadingHtml('Collecting database info…') + '</div>';
    var sizesP = S.sizes ? Promise.resolve() : loadSizes();
    Promise.all([api('dbInfo'), sizesP]).then(function (res) {
      var i = res[0], p = i.pragmas, d = currentDbMeta();
      var pageBytes = p.page_size * p.page_count;
      var freePct = p.page_count ? p.freelist_count / p.page_count * 100 : 0;
      var tables = S.ov.tables.filter(function (t) { return t.type === 'table'; });
      var totalRows = tables.reduce(function (a, t) { return a + (t.rows || 0); }, 0);
      var html = '<div class="stats">' +
        statCard('File size', fmtBytes(i.size), i.walSize ? '+ ' + fmtBytes(i.walSize) + ' WAL' : 'no pending WAL') +
        statCard('Tables', fmtNum(tables.length), fmtNum(S.ov.tables.length - tables.length) + ' views · ' + fmtNum(S.ov.indexCount) + ' indexes') +
        statCard('Rows', fmtNum(totalRows), 'across all tables') +
        statCard('Pages', fmtNum(p.page_count), fmtBytes(p.page_size) + ' each') +
        statCard('Free space', fmtBytes(p.page_size * p.freelist_count), Math.round(freePct * 10) / 10 + '% of file' + (freePct > 20 ? ' · VACUUM would help' : '')) +
        statCard('Journal', esc(String(p.journal_mode || '—').toUpperCase()), 'encoding ' + (p.encoding || '—')) +
        '</div>';

      // Largest tables
      var sizes = S.sizes && S.sizes.sizes || {};
      var ranked = tables.map(function (t) { return { t: t, b: sizes[t.name] || 0 }; }).sort(function (a, b) { return b.b - a.b || (b.t.rows || 0) - (a.t.rows || 0); }).slice(0, 12);
      var max = ranked.length ? ranked[0].b || 1 : 1;
      html += '<div class="card" style="margin-top:12px"><div class="card-h">' + icon('chart', 'sm') + 'Largest tables<span class="spacer"></span><span class="badge">' +
        (S.sizes && S.sizes.method === 'dbstat' ? 'exact (dbstat)' : 'estimated from data') + '</span></div><div class="card-b"><div class="bars">' +
        ranked.map(function (r) {
          return '<div class="bar" data-act="open-table" data-table="' + esc(r.t.name) + '"><div class="bl"><span class="ellipsis"><b>' + esc(r.t.logicalName || r.t.name) + '</b> <span class="muted small">' + fmtNum(r.t.rows) + ' rows</span></span>' +
            '<span class="nowrap">' + fmtBytes(r.b) + '</span></div><div class="bt"><div class="bf" style="width:' + Math.max(1, r.b / max * 100) + '%"></div></div></div>';
        }).join('') + '</div></div></div>';

      // OutSystems
      if (S.ov.outsystems) {
        var ents = tables.filter(function (t) { return t.logicalName; });
        var empty = ents.filter(function (t) { return !t.rows; }).length;
        html += '<div class="card"><div class="card-h">' + icon('layers', 'sm') + 'OutSystems local storage</div><div class="card-b"><dl class="kv">' +
          '<dt>Local entities</dt><dd>' + fmtNum(ents.length) + ' <span class="muted">(' + fmtNum(empty) + ' empty)</span></dd>' +
          '<dt>Naming</dt><dd class="small">Physical tables follow <code>OSUSR_&lt;module&gt;_&lt;ENTITY&gt;</code>; the inspector shows logical names from <code>OSSYS_ENTITY</code> and infers references from <code>&lt;Entity&gt;Id</code> attributes.</dd>' +
          '</dl><div class="row wrap" style="margin-top:10px"><button class="btn sm" data-act="open-table" data-table="OSSYS_ENTITY">' + icon('table', 'sm') + 'OSSYS_ENTITY</button>' +
          (S.cat.tables.OSSYS_LOG ? '<button class="btn sm" data-act="open-table" data-table="OSSYS_LOG">' + icon('table', 'sm') + 'Client logs (' + fmtNum(S.cat.tables.OSSYS_LOG.rows) + ')</button>' : '') + '</div></div></div>';
      }

      // Details
      html += '<div class="card"><div class="card-h">' + icon('info', 'sm') + 'Details</div><div class="card-b"><dl class="kv">' +
        '<dt>Path</dt><dd class="mono small">' + esc(i.path) + ' <button class="link small" data-act="copy" data-text="' + esc(i.path) + '">copy</button></dd>' +
        '<dt>Modified</dt><dd>' + esc(fmtDate(i.modified)) + '</dd>' +
        (i.walNote ? '<dt>WAL</dt><dd>' + esc(i.walNote) + '</dd>' : '') +
        '<dt>SQLite</dt><dd>' + esc(i.sqliteVersion) + '</dd>' +
        '<dt>user_version</dt><dd class="mono">' + esc(p.user_version) + '</dd>' +
        '<dt>schema_version</dt><dd class="mono">' + esc(p.schema_version) + '</dd>' +
        '<dt>application_id</dt><dd class="mono">' + esc(p.application_id) + '</dd>' +
        '<dt>auto_vacuum</dt><dd class="mono">' + esc(['none', 'full', 'incremental'][p.auto_vacuum] || p.auto_vacuum) + '</dd>' +
        '<dt>Objects</dt><dd>' + Object.keys(i.objects).map(function (k) { return '<span class="badge">' + esc(k) + ' · ' + i.objects[k] + '</span>'; }).join(' ') + '</dd>' +
        (S.ctx ? '<dt>App</dt><dd>' + esc(S.ctx.appId) + ' ' + esc(S.ctx.appVersion || '') + '</dd><dt>Device</dt><dd>' + esc(S.ctx.device) + ' · ' + esc(S.ctx.platform) + ' ' + esc(S.ctx.osVersion) + '</dd>' : '') +
        '</dl></div></div>';

      // Actions
      html += '<div class="card"><div class="card-h">' + icon('shield', 'sm') + 'Maintenance</div><div class="card-b">' +
        '<div class="row wrap"><button class="btn" data-act="integrity">' + icon('check', 'sm') + 'Quick integrity check</button>' +
        '<button class="btn" data-act="export-db">' + icon('download', 'sm') + 'Export database file</button></div>' +
        '<div id="integrityOut" style="margin-top:10px"></div>' +
        '<div class="small muted" style="margin-top:8px">The export is a consistent copy (pending WAL changes included), made without touching the app’s own file.</div></div></div>';
      $('#info').innerHTML = html;
    }).catch(function (e) { $('#info').innerHTML = errorHtml(e); });
  }

  // =========================================================================================
  // Actions (event delegation)
  // =========================================================================================
  var ACT = {
    'pick-db': function () { pickDbModal(); },
    'add-files': function () { addFiles(); },
    'close': function () { Bridge.call('close').catch(function () { toast('Close is handled by the host app'); }); },
    'toggle-theme': function () {
      S.prefs.theme = { auto: 'light', light: 'dark', dark: 'auto' }[S.prefs.theme] || 'auto';
      savePrefs(); applyTheme(); renderHeader();
      toast('Theme: ' + S.prefs.theme);
    },
    'nav': function (el) { S.view = el.getAttribute('data-view'); render(); view.scrollTop = 0; },
    'toggle-system': function () { S.prefs.showSystem = !S.prefs.showSystem; savePrefs(); renderTables(); },
    'open-table': function (el) { modals.slice().forEach(function (m) { m.close(); }); openTable(el.getAttribute('data-table')); },
    'close-table': function () { S.table = null; renderTables(); },
    'table-tab': function (el) { S.tableTab = el.getAttribute('data-tab'); renderTableDetail(); },
    'query-table': function () { startBuilderFor(S.table); },
    'grid-sort': function (el) {
      var c = el.getAttribute('data-col');
      if (S.grid.sortColumn !== c) { S.grid.sortColumn = c; S.grid.sortDir = 'asc'; }
      else if (S.grid.sortDir === 'asc') S.grid.sortDir = 'desc';
      else { S.grid.sortColumn = ''; S.grid.sortDir = 'asc'; }
      S.grid.offset = 0; loadGrid();
    },
    'grid-page': function (el) {
      var dir = +el.getAttribute('data-dir');
      S.grid.offset = Math.max(0, S.grid.offset + dir * S.grid.limit);
      loadGrid();
      var body = $('#dbody'); if (body) body.scrollTop = 0;
    },
    'grid-row': function (el) {
      var i = +el.getAttribute('data-i'), r = S.gridData;
      rowSheet(r.columns, r.rows[i], { table: S.table, rowid: r.rowids ? r.rowids[i] : null, title: tableLabel(S.table) + ' · row ' + (r.offset + i + 1) });
    },
    'col-stats': function (el) { colStatsModal(S.table, el.getAttribute('data-col')); },
    'copy-ddl': function () { var s = S.schemas[S.table]; if (s) copyText(s.sql); },
    'copy': function (el) { copyText(el.getAttribute('data-text')); },
    'q-tab': function (el) { S.qTab = el.getAttribute('data-tab'); renderQuery(); },

    // builder
    'qb-set': function (el) { var v = el.getAttribute('data-val'); onQbChange(el.getAttribute('data-path'), el.getAttribute('data-path') === 'limit' ? v : v, true); },
    'qb-del': function (el) { delPath(S.qb, el.getAttribute('data-path')); renderBuilderBody(); },
    'qb-add-cond': function (el) { getPath(S.qb, el.getAttribute('data-path')).items.push({ kind: 'cond', col: '', opr: '=', v: '' }); renderBuilderBody(); },
    'qb-add-group': function (el) { var g = newGroup(); g.op = 'OR'; g.items.push({ kind: 'cond', col: '', opr: '=', v: '' }); getPath(S.qb, el.getAttribute('data-path')).items.push(g); renderBuilderBody(); },
    'qb-add-join': function () { S.qb.joins.push({ type: 'LEFT', table: '', alias: '', on: [{ l: '', r: '' }] }); renderBuilderBody(); },
    'qb-add-on': function (el) { getPath(S.qb, el.getAttribute('data-path')).on.push({ l: '', r: '' }); renderBuilderBody(); },
    'qb-suggest': function (el) {
      var s = joinSuggestions(S.qb)[+el.getAttribute('data-i')];
      var taken = qbScope(S.qb).map(function (x) { return x.alias; });
      var alias = makeAlias(s.table, taken);
      S.qb.joins.push({ type: 'LEFT', table: s.table, alias: alias, on: [{ l: s.l, r: alias + '.' + s.rc }] });
      renderBuilderBody();
    },
    'qb-add-col': function () { S.qb.columns.push({ agg: '', expr: '', alias: '' }); renderBuilderBody(); },
    'qb-add-count': function () { S.qb.columns.push({ agg: 'COUNT', expr: '*', alias: 'total' }); renderBuilderBody(); },
    'qb-autogroup': function () {
      S.qb.columns.forEach(function (c) { if (!c.agg && c.expr && c.expr.indexOf('*') < 0 && S.qb.groupBy.indexOf(c.expr) < 0) S.qb.groupBy.push(c.expr); });
      renderBuilderBody();
    },
    'qb-add-gb': function () { S.qb.groupBy.push(''); renderBuilderBody(); },
    'qb-add-ob': function () { S.qb.orderBy.push({ col: '', dir: 'ASC' }); renderBuilderBody(); },
    'qb-reset': function () { S.qb = newQb(); renderBuilderBody(); },
    'qb-run': function () { runSql(qbToSql(S.qb)); },
    'qb-explain': function () { runSql(qbToSql(S.qb), { explain: true }); },
    'qb-to-sql': function () { S.sql = qbToSql(S.qb); S.qTab = 'sql'; renderQuery(); },
    'qb-save': function () { presetModal(newPresetFrom(qbToSql(S.qb), S.qb), true); },

    // editor
    'sql-run': function () { runSql($('#sqlta').value); },
    'sql-explain': function () { runSql($('#sqlta').value, { explain: true }); },
    'sql-format': function () { var ta = $('#sqlta'); ta.value = formatSql(ta.value); S.sql = ta.value; ta.dispatchEvent(new Event('input')); },
    'sql-clear': function () { var ta = $('#sqlta'); ta.value = ''; S.sql = ''; ta.dispatchEvent(new Event('input')); ta.focus(); },
    'sql-save': function () { presetModal(newPresetFrom($('#sqlta').value, null), true); },
    'interrupt': function () { Bridge.call('interrupt'); },

    // results
    'res-row': function (el) { var r = S.result; rowSheet(r.columns, r.rows[+el.getAttribute('data-i')], { title: 'Result row ' + (+el.getAttribute('data-i') + 1) }); },
    'res-csv': function () { saveFile('query-' + stamp() + '.csv', 'text/csv', resultCsv(S.result)); },
    'res-json': function () { saveFile('query-' + stamp() + '.json', 'application/json', resultJson(S.result)); },
    'res-copy': function () { copyText(resultCsv(S.result)); },

    // history
    'hist-open': function (el) { S.sql = S.history[+el.getAttribute('data-i')].sql; S.qTab = 'sql'; renderQuery(); },
    'hist-clear': function () { confirmModal('Clear history', 'Remove all ' + S.history.length + ' recent queries?', 'Clear', true).then(function (ok) { if (ok) { S.history = []; storeSet('history', []); renderQuery(); } }); },

    // presets
    'preset-scope': function (el) { S.presetScope = el.getAttribute('data-val'); renderPresets(); },
    'preset-new': function () { presetModal(newPresetFrom(S.sql || 'SELECT *\nFROM sqlite_master', null), true); },
    'preset-import': function () { importModal(); },
    'preset-export': function () { exportPresets(S.presets); },
    'preset-export-one': function (el) { var p = findPreset(el.getAttribute('data-id')); exportPresets([p], p.name.replace(/[^\w-]+/g, '-').toLowerCase()); },
    'preset-examples': function () {
      var d = currentDbMeta();
      var list = EXAMPLES.filter(function (e) { return e.tags.indexOf('outsystems') < 0 || S.ov.outsystems; }).map(function (e, i) {
        return Object.assign({ id: 'example_' + e.name.replace(/\W+/g, '_').toLowerCase() }, e);
      });
      var st = mergePresets(list);
      persistPresets();
      toast(st.added ? st.added + ' example presets added' : 'Examples already added');
      renderPresets(); renderNav();
    },
    'preset-run': function (el) { openPreset(findPreset(el.getAttribute('data-id')), true); },
    'preset-open': function (el) { openPreset(findPreset(el.getAttribute('data-id')), false); },
    'preset-edit': function (el) { presetModal(clone(findPreset(el.getAttribute('data-id'))), false); },
    'preset-dup': function (el) {
      var p = clone(findPreset(el.getAttribute('data-id')));
      p.id = uid(); p.name += ' (copy)'; p.createdAt = p.updatedAt = Date.now();
      S.presets.push(p); persistPresets(); renderPresets(); renderNav();
    },
    'preset-del': function (el) {
      var p = findPreset(el.getAttribute('data-id'));
      confirmModal('Delete preset', 'Delete “' + p.name + '”? This cannot be undone.', 'Delete', true).then(function (ok) {
        if (!ok) return;
        S.presets = S.presets.filter(function (x) { return x.id !== p.id; });
        persistPresets(); renderPresets(); renderNav();
      });
    },

    // info
    'integrity': function () {
      var out = $('#integrityOut');
      out.innerHTML = loadingHtml('Checking… (can take a while on large files)');
      api('integrityCheck').then(function (r) {
        out.innerHTML = r.length === 1 && r[0] === 'ok' ? '<span class="badge success">' + icon('check', 'sm') + 'ok — no corruption found</span>' :
          '<div class="error-box">' + r.map(esc).join('\n') + '</div>';
      }).catch(function (e) { out.innerHTML = errorHtml(e); });
    },
    'export-db': function (el) {
      el.disabled = true;
      toast('Preparing export…');
      api('exportDatabase').then(function (r) { if (r && r.saved) toast('Database exported'); })
        .catch(function (e) { toast('Export failed: ' + e.message); })
        .then(function () { el.disabled = false; });
    }
  };

  document.addEventListener('click', function (e) {
    var el = e.target.closest('[data-act]');
    if (!el || el.disabled) return;
    if (el.closest('.overlay') && !/^(open-table)$/.test(el.getAttribute('data-act'))) return;
    var fn = ACT[el.getAttribute('data-act')];
    if (fn) { e.preventDefault(); fn(el, e); }
  });
  // Builder inputs: selects/checkboxes re-render (they change the shape), text only refreshes SQL.
  view.addEventListener('change', function (e) {
    var el = e.target, path = el.getAttribute && el.getAttribute('data-qb');
    if (!path) return;
    onQbChange(path, el.type === 'checkbox' ? el.checked : el.value, el.tagName === 'SELECT' || el.type === 'checkbox');
  });
  view.addEventListener('input', function (e) {
    var el = e.target, path = el.getAttribute && el.getAttribute('data-qb');
    if (!path || el.tagName === 'SELECT' || el.type === 'checkbox') return;
    onQbChange(path, el.value, false);
  });

  // Hardware back (Android): modals first, then table detail, then leave.
  window.__dbiBack = function () {
    if (modals.length) { modals[modals.length - 1].close(); return true; }
    if (S.view === 'tables' && S.table && isNarrow()) { S.table = null; renderTables(); return true; }
    if (S.view !== 'tables') { S.view = 'tables'; render(); return true; }
    return false;
  };
  window.addEventListener('keydown', function (e) { if (e.key === 'Escape' && modals.length) modals[modals.length - 1].close(); });

  // =========================================================================================
  // Boot
  // =========================================================================================
  function boot() {
    renderHeader();
    view.innerHTML = loadingHtml('Scanning app sandbox…');
    Promise.all([
      Bridge.call('context').catch(function () { return { options: {} }; }),
      storeGet('prefs', {}), storeGet('presets', []), storeGet('history', []),
      loadDbList()
    ]).then(function (r) {
      S.ctx = r[0] || { options: {} };
      S.prefs = Object.assign(S.prefs, r[1] || {});
      S.presets = (r[2] || []).map(normalizePreset).filter(Boolean);
      S.history = r[3] || [];
      applyTheme();
      var opts = S.ctx.options || {};
      if (opts.presets) {
        try {
          var list = typeof opts.presets === 'string' ? parsePresetJson(opts.presets) : Array.isArray(opts.presets) ? opts.presets : opts.presets.presets || [];
          mergePresets(list);
          persistPresets();
        } catch (e) { toast('Invalid presets passed to open(): ' + e.message); }
      }
      var usable = S.dbs.filter(function (d) { return !d.encrypted && !d.empty; });
      var want = opts.database;
      var pick = (want && S.dbs.filter(function (d) { return (d.id === want || d.name === want) && !d.encrypted; })[0]) ||
        S.dbs.filter(function (d) { return d.id === S.prefs.lastDb && !d.encrypted; })[0] ||
        usable.slice().sort(function (a, b) { return b.size - a.size; })[0];
      if (pick) selectDb(pick.id); else render();
    }).catch(function (e) {
      view.innerHTML = '<div class="pad">' + errorHtml(e) + '</div>';
    });
  }
  boot();
})();
</script>
</body>
</html>
